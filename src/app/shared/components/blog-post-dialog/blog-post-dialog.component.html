<div
  class="backdrop"
  [class.backdrop-visible]="ready()"
  [class.backdrop-closing]="closing()"
  (click)="close()"
></div>

<div
  class="panel"
  [class.panel-ready]="ready()"
  [class.panel-closing]="closing()"
  role="dialog"
  aria-modal="true"
>
  <div class="panel-header">
    <span class="heading-sm panel-title">{{ title() }}</span>
    <button
      class="close-btn heading-sm"
      type="button"
      aria-label="Close"
      (click)="close()"
    >
      &#x2715;
    </button>
  </div>

  <div class="panel-body">
    @if (images().length) {
      <div class="images">
        @for (image of images(); track image.src) {
          <figure class="image">
            <img [src]="image.src" [alt]="image.alt" width="1120" height="700" decoding="async" />
            <figcaption class="body-sm">{{ image.caption }}</figcaption>
          </figure>
        }
      </div>
    }
    <p class="body-sm content-text">{{ content() }}</p>
  </div>
</div>
