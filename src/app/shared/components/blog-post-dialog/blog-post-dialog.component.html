<div
  class="backdrop"
  [class.backdrop-visible]="ready()"
  [class.backdrop-closing]="closing()"
  (click)="close()"
></div>

<div
  class="panel"
  [class.panel-ready]="ready()"
  [class.panel-closing]="closing()"
  role="dialog"
  aria-modal="true"
>
  <div class="panel-header">
    <span class="heading-sm panel-title">{{ title() }}</span>
    <button
      class="close-btn heading-sm"
      type="button"
      aria-label="Close"
      (click)="close()"
    >
      &#x2715;
    </button>
  </div>

  <div class="panel-body">
    @if (images().length) {
      <div class="images">
        @for (image of images(); track image.src; let i = $index) {
          <figure class="image">
            <button
              type="button"
              class="thumb"
              [attr.aria-label]="'View larger: ' + image.caption"
              (mouseenter)="soundService.playHover(0.3)"
              (click)="openImage(i, $event)"
            >
              <img
                [src]="image.src"
                [alt]="image.alt"
                [width]="image.width"
                [height]="image.height"
                loading="lazy"
                decoding="async"
              />
            </button>
            <figcaption class="body-sm">{{ image.caption }}</figcaption>
          </figure>
        }
      </div>
    }
    <p class="body-sm content-text">{{ content() }}</p>
  </div>
</div>

@if (activeImage(); as image) {
  <div
    class="lightbox"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="image.caption"
    (click)="closeImage()"
  >
    <figure class="lightbox-figure">
      <img
        class="lightbox-image"
        [src]="image.src"
        [alt]="image.alt"
        [width]="image.width"
        [height]="image.height"
        (click)="$event.stopPropagation()"
      />
      <figcaption class="lightbox-caption body-sm">
        {{ image.caption }}
        <span class="lightbox-count">{{ activeIndex()! + 1 }} / {{ images().length }}</span>
      </figcaption>
    </figure>

    <button
      #lightboxClose
      type="button"
      class="lightbox-btn lightbox-close heading-sm"
      aria-label="Close image"
      (click)="closeImage()"
    >
      &#x2715;
    </button>

    @if (images().length > 1) {
      <button
        type="button"
        class="lightbox-btn lightbox-prev heading-sm"
        aria-label="Previous image"
        (click)="step(-1, $event)"
      >
        &#x2190;
      </button>
      <button
        type="button"
        class="lightbox-btn lightbox-next heading-sm"
        aria-label="Next image"
        (click)="step(1, $event)"
      >
        &#x2192;
      </button>
    }
  </div>
}
